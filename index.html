<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Skin Studio">
<title>Slither Skin Studio Pro</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--card2:#f7f8fd;--tx:#161c33;--mu:#68718d;--ac:#6758f5;--ac2:#8a7dff;--acs:rgba(103,88,245,.12);--bd:#e0e4f1;--bd2:#cfd5e8;--sh:0 6px 22px rgba(25,35,75,.08);--ok:#16a05a;--bad:#e5484d;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c33;--card2:#1b2340;--tx:#eef1fb;--mu:#a0abc8;--ac:#9387ff;--ac2:#b0a6ff;--acs:rgba(147,135,255,.16);--bd:#273050;--bd2:#34406a;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c33;--card2:#1b2340;--tx:#eef1fb;--mu:#a0abc8;--ac:#9387ff;--ac2:#b0a6ff;--acs:rgba(147,135,255,.16);--bd:#273050;--bd2:#34406a;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;overflow:hidden;letter-spacing:-.01em}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-height:42px;font-weight:650;cursor:pointer;touch-action:manipulation;transition:transform .1s,background .15s,border-color .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;pointer-events:none}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 30%,transparent)}
button.on{background:var(--acs);border-color:var(--ac);color:var(--ac)}
button.i{width:42px;min-width:42px;padding:0;font-size:18px}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
#app{display:flex;flex-direction:column;height:var(--vh,100dvh);max-width:1080px;margin:auto;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
header h1{font-size:18px;font-weight:850;letter-spacing:-.04em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-size:11px;font-weight:600;color:var(--mu);letter-spacing:0;margin-top:-2px}
#stage{position:relative;height:clamp(150px,25vh,270px);margin:0 12px 10px;border-radius:22px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd);flex:none}
#cv{width:100%;height:100%;display:block;touch-action:none}
.sbar{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:7px;align-items:center}
.dot{width:28px;height:28px;min-height:0;border-radius:50%;border:3px solid #fff;padding:0;box-shadow:0 1px 5px #0004}
.sbar .p{min-height:34px;padding:4px 12px;font-size:13px}
.sbar .gl{background:#0009;color:#fff;border-color:#fff3;min-height:34px;padding:4px 10px;font-size:13px;backdrop-filter:blur(6px)}
body.kb #stage{height:90px}body.kb nav{display:none}
#panel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 12px 24px;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pane{display:none}.pane.on{display:block;animation:pin .2s ease}
@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin:20px 2px 9px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:4px;height:13px;border-radius:8px;background:var(--ac)}
.sec .sp1{flex:1}.sec button{min-height:30px;padding:2px 10px;font-size:12px;text-transform:none;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px;box-shadow:var(--sh)}
.hint{font-size:12.5px;color:var(--mu);line-height:1.55;margin:6px 2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
label{display:block;font-size:12px;font-weight:650;color:var(--mu);margin:2px 0 5px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px}
input:focus,textarea:focus,select:focus{outline:3px solid color-mix(in srgb,var(--ac) 22%,transparent);border-color:var(--ac)}
input[type=color]{width:100%;height:46px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);padding:3px;cursor:pointer}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;min-height:38px;border-radius:11px;font-size:13px;padding:4px 6px}
.seg button.on{background:var(--card);color:var(--ac);box-shadow:0 1px 6px #0002}
.hs{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.hs>*{flex:none;scroll-snap-align:start}
.tc{width:clamp(138px,42vw,172px);padding:7px;border:1px solid var(--bd);border-radius:16px;background:var(--card);font-size:12px;font-weight:650;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.tc canvas,.row canvas{display:block;width:100%;height:auto;aspect-ratio:2.33;border-radius:11px;background:#3b78d8}
.tc div{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.tc small{display:block;color:var(--mu);font-weight:500;font-size:11px}
.pal{width:62px;height:38px;padding:0;border-radius:11px}
.pal.on{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.pk{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;min-height:68px;border-radius:16px}
.pk canvas{width:74px;height:50px;border-radius:10px;flex:none;background:#3b78d8}
.pk .t{min-width:0;flex:1}.pk .t small{display:block;font-size:11px;font-weight:600;color:var(--mu)}.pk .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .ch{color:var(--mu);font-size:18px}
.opt{padding:6px;border-radius:14px;font-size:12px;text-align:center;display:block;min-height:0}
.opt canvas{width:100%;height:auto;aspect-ratio:1.5;border-radius:9px;display:block;background:#3b78d8}
.opt span{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{min-height:36px;padding:5px 12px;border-radius:999px;font-size:13px}
.chipbar{display:flex;gap:7px;overflow-x:auto;padding:8px 2px;position:sticky;top:-2px;z-index:4;background:var(--bg);touch-action:pan-x pan-y;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.chipbar button{flex:none;min-height:38px;border-radius:999px;padding:4px 14px;font-size:13px}
/* sliders */
.sl2{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 10px 4px;margin-bottom:8px;user-select:none;-webkit-user-select:none}
.sl2 .sh2{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sl2 .lb{flex:1;font-size:13px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.sl2 .val{min-width:54px;min-height:28px;padding:2px 8px;border-radius:9px;font-size:12.5px;color:var(--ac);background:var(--acs);border-color:transparent;font-variant-numeric:tabular-nums}
.sl2 .trk{display:flex;align-items:center;gap:6px}
.sl2 .st{width:36px;min-width:36px;height:36px;min-height:36px;padding:0;border-radius:11px;font-size:20px;line-height:1;color:var(--mu)}
.sl2 .rail{position:relative;flex:1;height:40px;touch-action:pan-y;cursor:pointer}
.sl2 .rail::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:8px;margin-top:-4px;border-radius:99px;background:var(--bd)}
.sl2 .fill{position:absolute;left:14px;top:50%;height:8px;margin-top:-4px;border-radius:99px;background:linear-gradient(90deg,var(--ac2),var(--ac));width:calc((100% - 28px)*var(--p,0))}
.sl2 .thumb{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;left:calc(14px + (100% - 28px)*var(--p,0));border-radius:50%;background:var(--card);border:6px solid var(--ac);box-shadow:0 2px 7px #0004;transition:transform .12s}
.sl2 .thumb::after{content:"";position:absolute;inset:-12px}
.sl2.act .thumb{transform:scale(1.25)}
.sl2.act{border-color:var(--ac)}
/* nav */
nav{flex:none;display:flex;gap:2px;border-top:1px solid var(--bd);background:var(--card);padding:6px 6px max(6px,env(safe-area-inset-bottom,0));box-shadow:0 -6px 22px rgba(20,30,70,.06);position:relative;z-index:5}
nav button{flex:1;min-width:0;flex-direction:column;border:0;background:transparent;box-shadow:none;border-radius:14px;min-height:54px;padding:5px 2px;font-size:11px;font-weight:700;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:2px}
nav button .ni{font-size:21px;line-height:1;transition:transform .2s}
nav button.on{color:var(--ac);background:var(--acs)}
nav button.on .ni{transform:translateY(-1px) scale(1.12)}
/* rows */
.row{display:flex;gap:11px;align-items:center;padding:9px;border:1px solid var(--bd);border-radius:16px;margin-bottom:9px;background:var(--card)}
.row.on{border-color:var(--ac);background:var(--acs)}
.row canvas{width:104px;flex:none;aspect-ratio:2.33}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mu)}
.row button{min-width:40px;padding:0 8px}
.xr{display:flex;gap:9px;align-items:center;padding:7px 9px;border:1px solid var(--bd);border-radius:14px;margin-bottom:7px;background:var(--bg)}
.xr.on{border-color:var(--ac)}.xr input{width:22px;height:22px;flex:none;accent-color:var(--ac)}
.xr canvas{width:84px;height:36px;border-radius:8px;flex:none;background:#3b78d8}
.xr .t{flex:1;min-width:0;font-size:13px}.xr .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xr .t small{color:var(--mu);font-size:11px}.xr .t small.er{color:var(--bad)}
.xr button{min-height:34px;padding:4px 10px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--tx);margin:9px 0 2px}.chk input{width:20px;height:20px;flex:none;accent-color:var(--ac)}
pre{white-space:pre-wrap;word-break:break-all;font:11px ui-monospace,monospace;background:var(--bg);border-radius:10px;padding:8px;max-height:130px;overflow:auto;margin:6px 0}
.crow{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.crow>*{flex:1;min-width:0}
/* photo tab */
.hero{background:linear-gradient(135deg,var(--ac),#2f8cff);color:#fff;border:0;position:relative;overflow:hidden}
.hero h3{margin:0 0 4px;font-size:18px}.hero p{margin:0 0 12px;font-size:13px;opacity:.92;line-height:1.5}
.hero button{background:#fff;color:#2b2490;border-color:#fff}
.layer{display:flex;gap:11px;align-items:center;padding:10px;margin-bottom:9px}
.layer .pv{width:74px;height:74px;border-radius:14px;border:1px solid var(--bd);background:repeating-conic-gradient(#8884 0 25%,#fff2 0 50%) 0 0/14px 14px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.layer .pv img{max-width:100%;max-height:100%}.layer .b{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.layer .b button{min-height:36px;font-size:12.5px;padding:4px 10px}
/* sheets */
#sheets{position:fixed;inset:0;z-index:60;pointer-events:none}
.sh-back{position:absolute;inset:0;background:rgba(6,9,20,.55);opacity:0;transition:opacity .28s;pointer-events:auto;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sh-back.in{opacity:1}
.sh-back.clear{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:640px;background:var(--card);border-radius:26px 26px 0 0;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);pointer-events:auto;box-shadow:0 -14px 50px rgba(0,0,0,.28);border:1px solid var(--bd);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0)}
.sheet.in{transform:none}.sheet.drag{transition:none}
.sheet.half{max-height:56dvh}.sheet.full{height:94dvh;max-height:94dvh}
.sheet .grabw{flex:none;touch-action:none;cursor:grab}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--bd2);margin:9px auto 6px}
.sheet .shh{display:flex;align-items:center;gap:8px;padding:2px 14px 8px}
.sheet .shh b{flex:1;font-size:16px;font-weight:800;letter-spacing:-.02em}
.sheet .shh button{min-height:36px;width:36px;padding:0;border-radius:50%}
.sheet .sb{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
.sheet .sf{flex:none;display:flex;gap:9px;padding:10px 14px 12px;border-top:1px solid var(--bd);background:var(--card)}
.sheet .sf button{flex:1}
/* image studio */
.isv{position:relative;width:100%;margin:0 auto 8px;border-radius:16px;overflow:hidden;border:1px solid var(--bd);background:#888}
.isv canvas{display:block;width:100%;height:auto;touch-action:none}
.isv .tl{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.isv .tl button{min-height:34px;min-width:34px;padding:0 9px;background:#000a;color:#fff;border-color:#fff3;font-size:13px;backdrop-filter:blur(6px)}
.isv .tip{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:#fff;background:#0009;border-radius:9px;padding:3px 9px;pointer-events:none;max-width:80%}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.tools button{min-height:44px;font-size:13px}
.row3{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:6px 0}.row3 button{padding:2px;font-size:13px;min-height:40px}
.idea{padding:7px;border-radius:16px;border:1px solid var(--bd);background:var(--card);text-align:center;cursor:pointer;position:relative}
.idea canvas{display:block;width:100%;height:auto;aspect-ratio:2.33;border-radius:10px;background:#3b78d8}
.idea b{display:block;font-size:13px;margin-top:6px}.idea small{display:block;color:var(--mu);font-size:11px;line-height:1.35;margin-top:1px}
.idea:active{transform:scale(.98)}
.badge{position:absolute;left:10px;top:10px;font-size:10px;font-weight:800;background:var(--ac);color:#fff;border-radius:99px;padding:2px 8px}
.pal3{display:flex;gap:6px;margin:8px 0}.pal3 i{flex:1;height:28px;border-radius:9px;border:1px solid var(--bd)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0));transform:translate(-50%,10px);background:#161c33ee;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:99;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 24px #0004}
#toast.on{opacity:1;transform:translate(-50%,0)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;animation:rp .5s ease-out forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
button,.tc,.row,.idea{position:relative;overflow:hidden}
.lazy{opacity:.35}.lazy.ok{opacity:1;transition:opacity .25s}
@media(min-width:760px){#app{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,420px);grid-template-rows:auto minmax(0,1fr) auto;column-gap:18px;padding:12px 18px 0}header{grid-column:1/3}#stage{grid-column:1;grid-row:2;height:100%;min-height:340px;margin:0 0 12px}#panel{grid-column:2;grid-row:2;padding:0 4px 20px}nav{grid-column:1/3;grid-row:3;border-radius:16px 16px 0 0;border:1px solid var(--bd)}}
@media(max-width:380px){.g3{grid-template-columns:repeat(2,1fr)}header h1{font-size:16px}nav button{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.grid .tc{width:auto}
.chips.one{flex-wrap:nowrap;overflow-x:auto;touch-action:pan-x pan-y;padding-bottom:4px;scrollbar-width:none}.chips.one button{flex:none}
</style></head><body>
<div id="app">
<header><h1>🐍 Skin Studio Pro<small id="hsub">Slither Arena</small></h1><button class="i" id="undo" title="Undo">↶</button><button class="i" id="redo" title="Redo">↷</button><button class="i" id="play" title="Play/Pause">⏸</button></header>
<section id="stage"><canvas id="cv"></canvas><div class="sbar" id="sbar"></div></section>
<main id="panel">
<div class="pane on" id="p0"></div>
<div class="pane" id="p1"></div>
<div class="pane" id="p2"></div>
<div class="pane" id="p3"></div>
<div class="pane" id="p4"></div>
</main>
<nav id="tabs"></nav>
</div>
<div id="sheets"></div>
<div id="toast"></div>
<input type="file" id="fpick" accept="image/*" hidden>
<script>

const CRT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

files.forEach(f=>{const nm=te.encode(f.name),data=typeof f.data=="string"?te.encode(f.data):f.data,crc=crc32(data),h=new DataView(new ArrayBuffer(30));
h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
parts.push(h.buffer,nm,data);
const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
cen.push(c.buffer,nm);off+=30+nm.length+data.length});
let cs_=0;cen.forEach(p=>cs_+=p.byteLength||p.length);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs_,true);e.setUint32(16,off,true);
